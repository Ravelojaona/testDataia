[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rag-madagascar"
version = "1.0.0"
description = "RAG system over Wikipedia Madagascar page"
requires-python = ">=3.11"

[project.scripts]
rag = "src.adapters.cli.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that call real APIs (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
